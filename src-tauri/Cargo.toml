[package]
name = "tally-app"
version = "0.1.0"
edition = "2024"
description = "Tally IPTV player (desktop shell)"

[lib]
name = "tally_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tally-core = { path = "../crates/tally-core" }
